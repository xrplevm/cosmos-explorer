name: "Pull Request"

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ts-lint:
    name: TypeScript lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint --filter='!@cosmos-explorer/juno' --filter='!@cosmos-explorer/callisto-app'

  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for Go changes
        id: go-changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changes=$(git diff --name-only "$BASE_SHA" HEAD -- '*.go' '*.mod' '*.sum' 'go.work')
          if [[ -n "$changes" ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        if: steps.go-changes.outputs.changed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Lint juno
        if: steps.go-changes.outputs.changed == 'true'
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.3
          working-directory: packages/juno
          args: --timeout=10m

      - name: Lint callisto
        if: steps.go-changes.outputs.changed == 'true'
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.3
          working-directory: apps/callisto
          args: --timeout=10m

  ts-build:
    name: TypeScript build & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          NETWORK: mainnet
        run: pnpm turbo run build --filter='!@cosmos-explorer/juno' --filter='!@cosmos-explorer/callisto-app'

      - name: Typecheck
        run: pnpm turbo run typecheck --filter='!@cosmos-explorer/juno' --filter='!@cosmos-explorer/callisto-app'

  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for Go changes
        id: go-changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changes=$(git diff --name-only "$BASE_SHA" HEAD -- '*.go' '*.mod' '*.sum' 'go.work')
          if [[ -n "$changes" ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        if: steps.go-changes.outputs.changed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build callisto
        if: steps.go-changes.outputs.changed == 'true'
        working-directory: apps/callisto
        run: make build

      - name: Test juno
        if: steps.go-changes.outputs.changed == 'true'
        working-directory: packages/juno
        run: go test ./... -coverprofile=coverage.txt -covermode=atomic

      - name: Test callisto
        if: steps.go-changes.outputs.changed == 'true'
        working-directory: apps/callisto
        run: make test-unit stop-docker-test

  build-base:
    needs: [ts-lint, ts-build, go-lint, go-test]
    uses: ./.github/workflows/build-base.yaml
    secrets: inherit
    with:
      push: true
      tag: ${{ github.sha }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build-base
      cancel-in-progress: true

  build-callisto:
    needs: [build-base]
    uses: ./.github/workflows/build-callisto.yaml
    secrets: inherit
    with:
      target: integration
      push: false
      tag: ${{ github.sha }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build-callisto
      cancel-in-progress: true

  build-explorer:
    needs: [ build-base ]
    uses: ./.github/workflows/build-explorer.yaml
    secrets: inherit
    with:
      push: false
      target: integration
      tag: ${{ github.sha }}
      environment: mainnet
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build-explorer
      cancel-in-progress: true
