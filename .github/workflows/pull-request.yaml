name: "Pull Request"

on:
  # Default activity types: opened, synchronize and reopened.
  pull_request:

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only this job reads the pull request; the build jobs below keep the
    # permissions their reusable workflows declare.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        # Pinned to the v4.0.3 release commit, which was reviewed: it lists the
        # pull request's files through the GitHub API (read only) and runs git
        # without a shell.
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            go:
              - '**/*.go'
              - '**/*.mod'
              - '**/*.sum'
              - 'go.work'
              - '**/.golangci.yaml'
              - 'apps/callisto/Makefile'

  ts-lint:
    name: TypeScript lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint --filter='!@cosmos-explorer/juno' --filter='!@cosmos-explorer/callisto-app'

  go-lint:
    name: Go lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/callisto/go.mod

      - name: Lint juno
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.3
          working-directory: packages/juno
          args: --timeout=10m

      - name: Lint callisto
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.3
          working-directory: apps/callisto
          args: --timeout=10m

  ts-build:
    name: TypeScript build & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          NETWORK: mainnet
        run: pnpm turbo run build --filter='!@cosmos-explorer/juno' --filter='!@cosmos-explorer/callisto-app'

      - name: Typecheck
        run: pnpm turbo run typecheck --filter='!@cosmos-explorer/juno' --filter='!@cosmos-explorer/callisto-app'

  go-test:
    name: Go tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/callisto/go.mod

      - name: Build callisto
        working-directory: apps/callisto
        run: make build

      - name: Test juno
        working-directory: packages/juno
        run: go test ./... -coverprofile=coverage.txt -covermode=atomic

      - name: Test callisto
        working-directory: apps/callisto
        run: make test-unit stop-docker-test

  build-base:
    needs: [ts-lint, ts-build, go-lint, go-test]
    # Run when every check passed or was skipped (the Go jobs skip when no Go
    # changed); a job that only `needs` skipped jobs would be skipped itself.
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/build-base.yaml
    secrets: inherit
    with:
      push: true
      tag: ${{ github.sha }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build-base
      cancel-in-progress: true

  build-callisto:
    needs: [build-base]
    uses: ./.github/workflows/build-callisto.yaml
    secrets: inherit
    with:
      target: integration
      push: false
      tag: ${{ github.sha }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build-callisto
      cancel-in-progress: true

  build-explorer:
    needs: [build-base]
    uses: ./.github/workflows/build-explorer.yaml
    secrets: inherit
    with:
      push: false
      target: integration
      tag: ${{ github.sha }}
      environment: mainnet
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build-explorer
      cancel-in-progress: true
