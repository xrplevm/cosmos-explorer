name: "Build and deploy"

on:
  push:
    branches:
      - main

# Least privilege by default: every job gets a read-only token unless it
# asks for more below.
permissions:
  contents: read

jobs:
  build-base:
    # The reusable workflow logs in to GHCR with GITHUB_TOKEN and pushes or
    # caches images; a called workflow gets no more than its caller grants.
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build-base.yaml
    secrets: inherit
    with:
      push: true
      tag: ${{ github.sha }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build-base
      cancel-in-progress: true

  build-callisto:
    # The reusable workflow logs in to GHCR with GITHUB_TOKEN and pushes or
    # caches images; a called workflow gets no more than its caller grants.
    permissions:
      contents: read
      packages: write
      id-token: write
    needs: [build-base]
    uses: ./.github/workflows/build-callisto.yaml
    secrets: inherit
    with:
      push: true
      target: release
      tag: ${{ github.sha }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build-callisto
      cancel-in-progress: true

  build-explorer-mainnet:
    # The reusable workflow logs in to GHCR with GITHUB_TOKEN and pushes or
    # caches images; a called workflow gets no more than its caller grants.
    permissions:
      contents: read
      packages: write
      id-token: write
    needs: [build-base]
    uses: ./.github/workflows/build-explorer.yaml
    secrets: inherit
    with:
      push: true
      target: release
      tag: ${{ github.sha }}
      environment: mainnet
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build-explorer-mainnet
      cancel-in-progress: true

  build-explorer-testnet:
    # The reusable workflow logs in to GHCR with GITHUB_TOKEN and pushes or
    # caches images; a called workflow gets no more than its caller grants.
    permissions:
      contents: read
      packages: write
      id-token: write
    needs: [build-base]
    uses: ./.github/workflows/build-explorer.yaml
    secrets: inherit
    with:
      push: true
      target: release
      tag: ${{ github.sha }}
      environment: testnet
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build-explorer-testnet
      cancel-in-progress: true

  build-explorer-devnet:
    # The reusable workflow logs in to GHCR with GITHUB_TOKEN and pushes or
    # caches images; a called workflow gets no more than its caller grants.
    permissions:
      contents: read
      packages: write
      id-token: write
    needs: [build-base]
    uses: ./.github/workflows/build-explorer.yaml
    secrets: inherit
    with:
      push: true
      target: release
      tag: ${{ github.sha }}
      environment: devnet
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build-explorer-devnet
      cancel-in-progress: true
