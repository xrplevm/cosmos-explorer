version: "3.6"
services:
    hasura:
        image: hasura/graphql-engine:v2.6.1.cli-migrations-v3${HASURA_IMAGE_SUFFIX:-}
        restart: always
        environment:
            HASURA_GRAPHQL_DATABASE_URL: postgres://user:password@database:5432/database
            HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:?Set HASURA_GRAPHQL_ADMIN_SECRET in apps/callisto/.env}
            HASURA_GRAPHQL_UNAUTHORIZED_ROLE: anonymous
            HASURA_GRAPHQL_ENABLE_CONSOLE: ${HASURA_GRAPHQL_ENABLE_CONSOLE:-false}
            HASURA_GRAPHQL_DEV_MODE: ${HASURA_GRAPHQL_DEV_MODE:-false}
            HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
            ACTION_BASE_URL: ${ACTION_BASE_URL:-http://host.docker.internal:3000}
        volumes:
            - ./hasura/metadata:/hasura-metadata
        ports:
            - "127.0.0.1:${HASURA_PORT:-8080}:8080"

    database:
        image: postgres:17
        ports:
            - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
        environment:
            POSTGRES_USER: user
            POSTGRES_PASSWORD: password
            POSTGRES_DB: database
        volumes:
            - ./database/schema:/docker-entrypoint-initdb.d
